<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SportZone</title>
</head>

<body>

    <h1>Connexion - SportZone</h1>

    <form id="form-connexion">

        <label for="email">Email :</label>
        <input type="email" id="email" required>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" required>

        <button type="submit">Se connecter</button>

       </form>

    <p>Pas encore de compte ?
        <a href="inscription.html">Créer un compte</a>
    </p>

    <p id="message"></p>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="sport.html">Sports</a>
        <a href="actualités.html">Actualités</a>
        <a href="connexion.html">Connexion</a>
    </nav>
<script>
    document.getElementById("form-connexion").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const motdepasse = document.getElementById("password").value;

        const message = document.getElementById("message");
    
        try {
           const reponse = await fetch("https://sportzone-9xz2.onrender.com/connexion", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    motdepasse: motdepasse
                })
            });

            const resultat = await reponse.json();

            message.textContent = resultat.message || resultat.erreur;

        } catch (erreur) {
            message.textContent = "Impossible de contacter le serveur.";
        }
    });
</script>

</body>

</html>
