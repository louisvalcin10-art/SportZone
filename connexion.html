
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SportZone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #102A43, #168AAD);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .logo {
            color: white;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .carte-connexion {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .carte-connexion h1 {
            color: #102A43;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #102A43;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #CBD5E0;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #168AAD;
            box-shadow: 0 0 0 3px rgba(22, 138, 173, 0.15);
        }

        .bouton-principal {
            width: 100%;
            padding: 15px;
            background: #168AAD;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .bouton-principal:hover {
            background: #102A43;
            transform: translateY(-2px);
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        #bienvenue {
            text-align: center;
            color: #168AAD;
        }

        .inscription {
            text-align: center;
            margin-top: 25px;
            color: #718096;
        }

        .inscription a {
            color: #168AAD;
            font-weight: bold;
            text-decoration: none;
        }

        .inscription a:hover {
            text-decoration: underline;
        }

        .navigation {
            margin-top: 30px;
            text-align: center;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .navigation a:hover {
            color: #BDE0FE;
        }

        #deconnexion {
            display: block;
            margin: 20px auto 0;
            padding: 12px 20px;
            background: #102A43;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #deconnexion:hover {
            background: #168AAD;
        }

        @media (max-width: 450px) {
            .carte-connexion {
                padding: 30px 22px;
            }

            .navigation a {
                display: inline-block;
                margin: 7px;
            }
        }
    </style>
</head>

<body>

    <div class="logo">SPORTZONE</div>

    <main class="carte-connexion">

        <h1>Bienvenue !</h1>

        <p class="description">
            Connecte-toi pour retrouver ton espace SportZone.
        </p>

        <form id="form-connexion">

            <label for="email">Adresse e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Ton mot de passe"
                required
            >

            <button class="bouton-principal" type="submit">
                Se connecter
            </button>

        </form>

        <p id="message"></p>
        <h2 id="bienvenue"></h2>

        <button id="deconnexion" type="button" hidden>
            Se déconnecter
        </button>

        <p class="inscription">
            Pas encore de compte ?
            <a href="inscription.html">Créer un compte</a>
        </p>

    </main>

    <nav class="navigation">
        <a href="index.html">Accueil</a>
        <a href="sports.html">Sports</a>
        <a href="actualites.html">Actualités</a>
    </nav>

    <script>
        const formulaire = document.getElementById("form-connexion");
        const message = document.getElementById("message");
        const bienvenue = document.getElementById("bienvenue");
        const boutonDeconnexion = document.getElementById("deconnexion");

        function afficherUtilisateur() {
            const utilisateur = localStorage.getItem("utilisateur");

            if (utilisateur) {
                const donnees = JSON.parse(utilisateur);

                bienvenue.textContent = "Bienvenue, " + donnees.nom + " !";
                formulaire.hidden = true;
                boutonDeconnexion.hidden = false;
            }
        }

        afficherUtilisateur();

        formulaire.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const motdepasse = document.getElementById("password").value;

            message.textContent = "Connexion en cours...";

            try {
                const reponse = await fetch("https://sportzone-9xz2.onrender.com/connexion", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        motdepasse: motdepasse
                    })
                });

                const resultat = await reponse.json();

                if (reponse.ok && resultat.utilisateur) {
                    localStorage.setItem(
                        "utilisateur",
                        JSON.stringify(resultat.utilisateur)
                    );

                    message.textContent = "Connexion réussie !";
                    afficherUtilisateur();
                } else {
                    message.textContent = resultat.message || resultat.erreur || "Identifiants incorrects.";
                }

            } catch (erreur) {
                message.textContent = "Impossible de contacter le serveur.";
            }
        });

        boutonDeconnexion.addEventListener("click", function() {
            localStorage.removeItem("utilisateur");

            bienvenue.textContent = "";
            message.textContent = "Déconnexion réussie.";
            formulaire.hidden = false;
            boutonDeconnexion.hidden = true;
        });
    </script>

</body>
</html>
