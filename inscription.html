
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SportZone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #102A43, #168AAD);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: #102A43;
        }

        nav {
            margin-bottom: 25px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .carte {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            color: #102A43;
        }

        .description {
            text-align: center;
            color: #627D98;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #BCCCDC;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #168AAD;
            box-shadow: 0 0 0 3px rgba(22, 138, 173, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #168AAD;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #102A43;
        }

        .liens {
            text-align: center;
            margin-top: 25px;
            line-height: 2;
        }

        .liens a {
            color: #168AAD;
            text-decoration: none;
            font-weight: bold;
        }

        .liens a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .carte {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="sports.html">Sports</a>
        <a href="actualites.html">Actualités</a>
        <a href="connexion.html">Connexion</a>
    </nav>

    <div class="carte">

        <h1>Créer un compte</h1>

        <p class="description">
            Rejoins la communauté SportZone !
        </p>

        <form id="form-inscription">

            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="motdepasse">Mot de passe :</label>
            <input type="password" id="motdepasse" name="motdepasse"
                required minlength="8">

            <button type="submit">Créer mon compte</button>

        </form>

        <div class="liens">
            Déjà un compte ?
            <a href="connexion.html">Se connecter</a>
            <br>
            <a href="index.html">Retour à l'accueil</a>
        </div>

    </div>

    <script>
        document.getElementById("form-inscription").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nom = document.getElementById("nom").value;
            const email = document.getElementById("email").value;
            const motdepasse = document.getElementById("motdepasse").value;

            try {
                const reponse = await fetch("https://sportzone-9xz2.onrender.com/inscription", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nom: nom,
                        email: email,
                        motdepasse: motdepasse
                    })
                });

                const resultat = await reponse.json();

                if (reponse.ok) {
                    alert("Inscription réussie !");
                    window.location.href = "connexion.html";
                } else {
                    alert(resultat.erreur || "Erreur lors de l'inscription.");
                }

            } catch (erreur) {
                alert("Impossible de contacter le serveur. Vérifie que l'API est démarrée.");
            }
        });
    </script>

</body>
</html>
