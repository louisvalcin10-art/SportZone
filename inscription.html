```html
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SportZone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Créer un compte - SportZone</h1>

    <form id="form-inscription">

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <br><br>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="motdepasse">Mot de passe :</label>
        <input type="password" id="motdepasse" name="motdepasse" required minlength="8">

        <br><br>

        <button type="submit">S'inscrire</button>

    </form>

    <p>Déjà un compte ? <a href="connexion.html">Se connecter</a></p>

    <p><a href="index.html">Retour à l'accueil</a></p>

    <script>
        document.getElementById("form-inscription").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nom = document.getElementById("nom").value;
            const email = document.getElementById("email").value;
            const motdepasse = document.getElementById("motdepasse").value;

            try {
          const reponse = await fetch("https://sportzone-9xz2.onrender.com/inscription", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nom: nom,
                        email: email,
                        motdepasse: motdepasse
                    })
                });

                const resultat = await reponse.json();

                if (reponse.ok) {
                    alert("Inscription réussie !");
                    window.location.href = "connexion.html";
                } else {
                    alert(resultat.erreur || "Erreur lors de l'inscription.");
                }
            } catch (erreur) {
                alert("Impossible de contacter le serveur. Vérifie que l'API est démarrée.");
            }
        });
    </script>

</body>
</html>
```
